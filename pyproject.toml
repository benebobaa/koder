[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "koder"
version = "1.0.0"
description = "CLI-based code agent powered by LangGraph inspired by Anthropic Claude Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LangChain/LangGraph Core
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-deepseek>=0.1.4",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.1.2",

    # CLI & UI
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.0",
    "pygments>=2.17.0",

    # Code Intelligence
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",

    # MCP Integration
    "fastmcp>=2.0.0",
    "mcp>=1.0.0",

    # Vector Store & Embeddings
    "chromadb>=0.5.0",
    "google-generativeai>=0.8.0",

    # Checkpointing & State
    "langgraph-checkpoint-sqlite>=1.0.0",

    # Git Operations
    "gitpython>=3.1.0",

    # Observability
    "langsmith>=0.1.0",
    "structlog>=24.0.0",

    # Configuration & Validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",

    # Utilities
    "watchdog>=3.0.0",
    "tavily-python>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "safety>=3.0.0",
    "bandit>=1.7.0",
    "radon>=6.0.0",
    "twine>=5.0.0",
    "types-Pygments>=2.0.0",
    "types-requests>=2.0.0",
    "pip-licenses>=4.0.0",
]

[project.scripts]
koder = "koder.cli.app:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    "visualize_agent_graph.py",
    "visualize_agent_graph_matplotlib.py",
    "show_architecture.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # Ignore line length in tests
"koder/agent/prompts.py" = ["E501"]  # Long prompts are expected
"koder/cli/commands/**" = ["E501"]  # CLI help strings can be long
"koder/tools/**" = ["E501"]  # Tool descriptions can be long

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false
allow_subclassing_any = true
allow_untyped_calls = true
allow_untyped_defs = true

[tool.uv]
package = true

[tool.hatchling.build.targets.wheel]
packages = ["koder"]