name: Code Quality

on:
  push:
    branches: [ trunk, main ]
  pull_request:
    branches: [ trunk, main ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups --dev

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv pip install pip-licenses

      - name: Check licenses
        run: |
          uv run pip-licenses --from=mixed --format=table
          # Fail if there are any problematic licenses
          if uv run pip-licenses --fail-on="unknown;GPL;AGPL" --from=mixed; then
            echo "License check passed"
          else
            echo "License check failed - found problematic licenses"
            exit 1
          fi

  complexity-analysis:
    name: Code Complexity Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv sync --all-groups --dev
          uv pip install radon

      - name: Analyze code complexity
        run: |
          echo "## Code Complexity Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Cyclomatic Complexity" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          uv run radon cc koder/ --min B >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### Maintainability Index" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          uv run radon mi koder/ --min B >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check complexity thresholds
        run: |
          # Fail if any function has complexity > 10
          if uv run radon cc koder/ --min B | grep -E "[A-F]"; then
            echo "Found functions with high complexity (A-F grade)"
            exit 1
          fi

          # Fail if any module has maintainability index < 70
          if uv run radon mi koder/ --min B | grep -E "[A-F]"; then
            echo "Found modules with low maintainability (A-F grade)"
            exit 1
          fi

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  stale-dependencies:
    name: Check for Stale Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.13

      - name: Check for outdated dependencies
        run: |
          uv sync --all-groups --dev
          echo "## Outdated Dependencies" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for outdated packages
          uv pip list --outdated --format=json > outdated.json || true

          if [ -s outdated.json ]; then
            echo "Found outdated dependencies:" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat outdated.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No outdated dependencies found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload outdated dependencies report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outdated-dependencies
          path: outdated.json
          retention-days: 7