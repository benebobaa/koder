name: CI

on:
  push:
    branches: [ trunk, main ]
  pull_request:
    branches: [ trunk, main ]

env:
  UV_CACHE_DIR: "/tmp/uv-cache"

jobs:
  # Code quality checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-suffix: quality

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups --dev

      - name: Run ruff linting
        run: uv run ruff check .

      - name: Run ruff formatting check
        run: uv run ruff format --check .

      - name: Run mypy type checking
        run: uv run mypy koder

  # Test matrix across multiple Python versions and operating systems
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.13']
        include:
          # Add Python 3.12 only on Ubuntu for complete version coverage
          - os: ubuntu-latest
            python-version: '3.12'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.os }}-${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Cache UV dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-

      - name: Install dependencies
        run: uv sync --all-groups --dev
        env:
          UV_CACHE_DIR: ${{ env.UV_CACHE_DIR }}

      - name: Run unit tests
        run: uv run pytest tests/unit -v --cov=koder --cov-report=xml --cov-report=term-missing

      - name: Run integration tests
        run: uv run pytest tests/integration -v --cov=koder --cov-append --cov-report=xml --cov-report=term-missing
        env:
          # Set dummy environment variables for integration tests
          OPENAI_API_KEY: dummy_key_for_testing
          ANTHROPIC_API_KEY: dummy_key_for_testing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Build and package validation
  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Check package
        run: uv run twine check dist/*

      - name: Test package installation
        run: |
          uv venv test-install
          .test-install/bin/python -m pip install dist/*.whl
          .test-install/bin/python -c "import koder; print('Package imported successfully')"
          rm -rf test-install

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups --dev

      - name: Run safety check
        run: uv run safety check

      - name: Run bandit security linter
        run: uv run bandit -r koder/ -f json -o bandit-report.json

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  # License compliance check
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv pip install pip-licenses

      - name: Check licenses
        run: |
          uv run pip-licenses --from=mixed --format=table
          # Fail if there are any problematic licenses
          if uv run pip-licenses --fail-on="unknown;GPL;AGPL" --from=mixed; then
            echo "License check passed"
          else
            echo "License check failed - found problematic licenses"
            exit 1
          fi

  # End-to-end tests (run only on Ubuntu with latest Python)
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/trunk'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups --dev

      - name: Run e2e tests
        run: uv run pytest tests/e2e -v --timeout=300
        env:
          # Set dummy environment variables - real e2e tests should mock external APIs
          OPENAI_API_KEY: dummy_key_for_testing
          ANTHROPIC_API_KEY: dummy_key_for_testing
          LANGCHAIN_API_KEY: dummy_key_for_testing
          TAVILY_API_KEY: dummy_key_for_testing

  # Summary job
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality, test, build, security, license-check]
    if: always()
    steps:
      - name: CI Summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Check | ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY